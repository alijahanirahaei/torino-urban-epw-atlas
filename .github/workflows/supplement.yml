name: Publish supplementary material

on:
  push:
    tags: ["supplement-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing supplement tag to publish or verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supplement-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Retain current publication helper
        run: cp scripts/publish_release.py "$RUNNER_TEMP/publish_release.py"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_reduction.py --check
      - name: Publish supplement downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          python "$RUNNER_TEMP/publish_release.py"
          --kind supplement --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY"
