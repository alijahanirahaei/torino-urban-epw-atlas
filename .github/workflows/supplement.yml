name: Publish supplementary material

on:
  push:
    tags: ["supplement-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_release.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce_reduction.py --check
      - name: Build verified supplementary archive
        run: python scripts/validate_supplement.py --build-output "$RUNNER_TEMP/supplement-release"
      - name: Publish supplement downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag --latest=false
          --title "Torino study supplementary material v1.0.0"
          --notes-file "docs/release-notes-$GITHUB_REF_NAME.md"
          "$RUNNER_TEMP"/supplement-release/*
